<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Tray state icon: another mount exposes the sync files, so reads
       through it bypass hydration and can return placeholder zeros
       (HydrationAPI DESIGN.md §6.4a). Ported from OneDriveForLinux
       (https://github.com/franzjeger/OneDriveForLinux), whose tray rendered
       this cloud-and-badge design at runtime (crates/tray/src/icons.rs).
       The badge combines the donor's error red with its exclamation glyph:
       a hazard demanding attention, not a failed operation's cross. -->
  <g fill="#12181F" stroke="#12181F" stroke-width="1.8" opacity=".6">
    <circle cx="7.4" cy="12.4" r="4.4"/>
    <circle cx="12.2" cy="9.8" r="5.2"/>
    <circle cx="16.4" cy="12.8" r="3.9"/>
    <rect x="5" y="12" width="13.5" height="5.2"/>
  </g>
  <g fill="#E8EDF3">
    <circle cx="7.4" cy="12.4" r="4.4"/>
    <circle cx="12.2" cy="9.8" r="5.2"/>
    <circle cx="16.4" cy="12.8" r="3.9"/>
    <rect x="5" y="12" width="13.5" height="5.2"/>
  </g>
  <circle cx="17.3" cy="17" r="6.4" fill="#10151C" fill-opacity=".69"/>
  <circle cx="17.3" cy="17" r="5.3" fill="#D0716A"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round">
    <path d="M17.3 14.6v3"/>
    <path d="M17.3 19.4v.1"/>
  </g>
</svg>
