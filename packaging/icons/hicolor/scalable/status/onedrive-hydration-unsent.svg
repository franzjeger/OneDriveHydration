<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Tray state icon: local changes not yet uploaded. Ported from
       OneDriveForLinux (https://github.com/franzjeger/OneDriveForLinux),
       whose tray rendered this cloud-and-badge design at runtime
       (crates/tray/src/icons.rs). The badge keeps its activity blue and
       carries a single up arrow — only uploads are pending here, unlike the
       donor's two-way sync badge — with the arrow geometry taken from the
       donor's upload half. -->
  <g fill="#12181F" stroke="#12181F" stroke-width="1.8" opacity=".6">
    <circle cx="7.4" cy="12.4" r="4.4"/>
    <circle cx="12.2" cy="9.8" r="5.2"/>
    <circle cx="16.4" cy="12.8" r="3.9"/>
    <rect x="5" y="12" width="13.5" height="5.2"/>
  </g>
  <g fill="#E8EDF3">
    <circle cx="7.4" cy="12.4" r="4.4"/>
    <circle cx="12.2" cy="9.8" r="5.2"/>
    <circle cx="16.4" cy="12.8" r="3.9"/>
    <rect x="5" y="12" width="13.5" height="5.2"/>
  </g>
  <circle cx="17.3" cy="17" r="6.4" fill="#10151C" fill-opacity=".69"/>
  <circle cx="17.3" cy="17" r="5.3" fill="#5AA2DD"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.3 19.2v-4.4"/>
    <path d="M16 16.1l1.3-1.5 1.3 1.5"/>
  </g>
</svg>
