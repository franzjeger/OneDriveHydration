[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/franzjeger/HydrationAPI"]
