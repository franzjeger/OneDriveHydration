[workspace]
resolver = "2"
members = ["crates/onedrive-daemon"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
hydration-client = { version = "=0.1.0", git = "https://github.com/franzjeger/HydrationAPI", rev = "d7f8624f7d57aec4abb752267c0abff9abf59545" }
hydration-graph = { version = "=0.1.0", git = "https://github.com/franzjeger/HydrationAPI", rev = "d7f8624f7d57aec4abb752267c0abff9abf59545", features = ["http"] }
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
