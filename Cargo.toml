[workspace]
resolver = "2"
members = ["crates/onedrive-daemon"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.83"

[workspace.dependencies]
hydration-client = { git = "https://github.com/franzjeger/HydrationAPI", rev = "b6bb102748648d256de88400ed675f08b0ae1362" }
hydration-graph = { git = "https://github.com/franzjeger/HydrationAPI", rev = "b6bb102748648d256de88400ed675f08b0ae1362", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
