[workspace]
resolver = "2"
members = ["crates/onedrive-daemon"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.83"

[workspace.dependencies]
hydration-client = { git = "https://github.com/franzjeger/HydrationAPI", rev = "2c0b7f0a5c24b8beed390d31d4dae5d9e9da18c1" }
hydration-graph = { git = "https://github.com/franzjeger/HydrationAPI", rev = "2c0b7f0a5c24b8beed390d31d4dae5d9e9da18c1", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
