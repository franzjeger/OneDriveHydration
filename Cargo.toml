[workspace]
resolver = "2"
members = ["crates/onedrive-daemon", "crates/installer"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
blocking = "1"
libc = "0.2"
hydration-client = { version = "=0.1.0", git = "https://github.com/franzjeger/HydrationAPI", rev = "e08d2cc" }
hydration-graph = { version = "=0.1.0", git = "https://github.com/franzjeger/HydrationAPI", rev = "e08d2cc", features = ["http"] }
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# "event" is one zero-timeout poll: how the auth-state socket notices a
# watcher hung up during a quiet stretch without reading from it.
rustix = { version = "1", features = ["process", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Newest zbus whose tree still builds on this workspace's rust-version;
# 5.14.0 and later require Rust 1.87. Its zvariant/zbus_names/zvariant_utils
# companions are held back in Cargo.lock for the same reason.
zbus = { version = "=5.13.2", default-features = false, features = ["async-io", "blocking-api"] }
