[workspace]
resolver = "2"
members = ["crates/onedrive-daemon"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.83"

[workspace.dependencies]
hydration-client = { git = "https://github.com/franzjeger/HydrationAPI", rev = "5e4527a5864a9c3f3cf99d97872e459b44a12e85" }
hydration-graph = { git = "https://github.com/franzjeger/HydrationAPI", rev = "5e4527a5864a9c3f3cf99d97872e459b44a12e85", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
