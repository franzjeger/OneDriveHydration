name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  package-payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the HydrationAPI revision locked by the product
        id: hydration_api
        run: echo "rev=$(tools/hydration-api-rev.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: franzjeger/HydrationAPI
          ref: ${{ steps.hydration_api.outputs.rev }}
          path: .upstream/hydration-api
      - uses: dtolnay/rust-toolchain@1.85
      - name: Install Secret Service build dependency
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Build product binaries
        run: cargo build --release --locked --workspace
      - name: Build the locked-revision privileged helper
        working-directory: .upstream/hydration-api
        run: cargo build --release --locked -p hydrationd --bin hydrationd
      - name: Verify the complete payload
        run: |
          test -x target/release/onedrive-hydration-daemon
          test -x target/release/onedrive-hydrationctl
          test -x target/release/onedrive-hydration-dbus
          test -x target/release/onedrive-hydration-tray
          test -x target/release/onedrive-hydration-install
          test -x .upstream/hydration-api/target/release/hydrationd

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The installer's refusals, fired against the real binary on a real machine.
  # The unit-level proofs (bad template, synthetic mount tables, injected
  # kernels) run in `cargo test` under the rust job; this job exercises the
  # CLI end to end against conditions the runner genuinely has. What cannot
  # run here is the all-checks-green install: runner kernels predate 6.14
  # (no pre-content events) and runner sessions have no user D-Bus, so the
  # kernel and secret-service checks refuse — which is itself the measurement
  # this job asserts. The full pass is exercised on a real 6.14+ desktop
  # (loop ext4 mount, live session bus); see packaging/systemd/README.md.
  installer-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - name: Build the installer
        run: cargo build --locked -p onedrive-hydration-install
      - name: A plain directory is refused, with the dirmark reason
        run: |
          mkdir -p /tmp/not-a-mount
          set +e
          out=$(./target/debug/onedrive-hydration-install install \
            --user "$(id -un)" --mount /tmp/not-a-mount --client-id ci \
            --dry-run --prefix /tmp/prefix)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 1
          echo "$out" | grep -q "not a mount point"
          echo "$out" | grep -q "delivers nothing"
      - name: A tmpfs sync root is refused by name
        run: |
          set +e
          out=$(./target/debug/onedrive-hydration-install install \
            --user "$(id -un)" --mount /dev/shm --client-id ci \
            --dry-run --prefix /tmp/prefix)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 1
          echo "$out" | grep -q "tmpfs"
          echo "$out" | grep -q "SB_I_ALLOW_HSM"
      - name: The kernel check answers with a syscall measurement as root
        run: |
          truncate -s 64M /tmp/fs.img
          mkfs.ext4 -q /tmp/fs.img
          mkdir -p /tmp/loopmnt
          sudo mount -o loop /tmp/fs.img /tmp/loopmnt
          set +e
          out=$(sudo ./target/debug/onedrive-hydration-install install \
            --user "$(id -un)" --mount /tmp/loopmnt --client-id ci \
            --dry-run --prefix /tmp/prefix)
          rc=$?
          set -e
          echo "$out"
          rel=$(uname -r); maj=${rel%%.*}; rest=${rel#*.}; min=${rest%%[!0-9]*}
          if [ "$maj" -gt 6 ] || { [ "$maj" -eq 6 ] && [ "$min" -ge 14 ]; }; then
            # New enough: the kernel check must PASS as a measurement, and the
            # remaining refusal (no session bus for secret-service) still
            # holds the door shut.
            echo "$out" | grep -q "accepts FAN_PRE_ACCESS marks (measured)"
          else
            # Runner kernels predate pre-content events: the refusal must be
            # the measured EINVAL, not a version guess.
            test "$rc" -eq 1
            echo "$out" | grep -q "rejected FAN_PRE_ACCESS with EINVAL"
          fi
          sudo umount /tmp/loopmnt

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - name: Install Secret Service build dependency
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - run: cargo check --workspace --all-targets --locked

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Secret Service build dependency
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The one compiled non-Rust artifact: the Dolphin overlay plugin
  # (packaging/dolphin/overlay/). cargo never sees it, so without this job a
  # change that breaks it against KF6 lands unnoticed. This is the second
  # toolchain the overlay always cost — Qt6 + KF6 + ECM on top of Rust — and
  # `cargo test`'s dolphin_overlay_package.rs still pins the source-level
  # contracts (the xattr it probes, that it reads no content); this pins that
  # the source actually compiles and links a MODULE .so against a real KF6.
  overlay-plugin:
    runs-on: ubuntu-latest
    # In a Fedora container, not on the bare Ubuntu runner: Ubuntu 24.04's
    # default KDE is still KF5 and Noble has no libkf6kio-dev (measured — apt
    # exit 100, "Unable to locate package"). Fedora packages the full KF6 SDK,
    # so this is where the second toolchain the overlay costs actually lives.
    # The user's own desktop is a newer KF6 still; any real KF6 catches the
    # breakage this job exists for.
    container: fedora:41
    steps:
      - uses: actions/checkout@v7
      - name: Install the KF6 build toolchain
        # No sudo: the container runs as root. If a package name is wrong for
        # this Fedora, dnf fails loudly here rather than skipping the build.
        run: |
          dnf install -y \
            cmake extra-cmake-modules qt6-qtbase-devel kf6-kio-devel gcc-c++ file
      - name: Configure and build the overlay plugin
        run: |
          cmake -S packaging/dolphin/overlay -B build/overlay \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/overlay
      - name: A MODULE .so was produced (not a static .a fallback)
        run: |
          so=$(find build/overlay -name 'onedrive-hydration-overlay.so' | head -n1)
          test -n "$so" || { echo "no plugin .so was built"; find build/overlay -name '*.so' -o -name '*.a'; exit 1; }
          file "$so" | grep -q 'shared object'
          echo "built $so"
