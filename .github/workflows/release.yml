name: Linux release artifact

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-tarball:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: product
      - name: Resolve the HydrationAPI revision locked by the product
        id: hydration_api
        working-directory: product
        run: echo "rev=$(tools/hydration-api-rev.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: franzjeger/HydrationAPI
          ref: ${{ steps.hydration_api.outputs.rev }}
          path: hydration-api
      - uses: dtolnay/rust-toolchain@1.85
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Build unprivileged product binaries
        working-directory: product
        run: cargo build --release --locked --workspace
      - name: Build the revision-matched privileged helper
        working-directory: hydration-api
        run: cargo build --release --locked -p hydrationd --bin hydrationd
      - name: Assemble one auditable product payload
        run: |
          epoch=$(git -C product show -s --format=%ct HEAD)
          SOURCE_DATE_EPOCH=$epoch product/tools/assemble-release.sh \
            product hydration-api onedrive-hydration-linux-x86_64.tar.gz
          for path in \
            ./bin/hydrationd \
            ./bin/onedrive-hydration-daemon \
            ./bin/onedrive-hydrationctl \
            ./bin/onedrive-hydration-dbus \
            ./bin/onedrive-hydration-tray \
            ./bin/onedrive-hydration-install \
            ./share/onedrive-hydration/packaging/icons/install-icons.sh \
            ./share/onedrive-hydration/packaging/plasmoid/install-plasmoid.sh \
            ./share/onedrive-hydration/packaging/dolphin/install-servicemenu.sh \
            ./share/onedrive-hydration/packaging/dolphin/overlay/install-overlay.sh \
            ./share/doc/onedrive-hydration/MANIFEST.sha256
          do
            tar -tzf onedrive-hydration-linux-x86_64.tar.gz | grep -Fx "$path"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: onedrive-hydration-linux-x86_64
          path: |
            onedrive-hydration-linux-x86_64.tar.gz
            onedrive-hydration-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            onedrive-hydration-linux-x86_64.tar.gz \
            onedrive-hydration-linux-x86_64.tar.gz.sha256
